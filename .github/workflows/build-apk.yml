name: Build SRK Bot APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - edition: full
            assets: assets
            apk: SRK-Bot.apk
          - edition: offline
            assets: assets-offline
            apk: SRK-Bot-Offline.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set)

      - name: Install dependencies
        run: |
          npm install
          npm run vendor

      - name: Select edition (${{ matrix.edition }})
        run: node scripts/edition.js ${{ matrix.edition }}

      - name: Create Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android --assetPath ${{ matrix.assets }} \
            --iconBackgroundColor '#0f1115' --iconBackgroundColorDark '#0f1115' \
            --splashBackgroundColor '#0f1115' --splashBackgroundColorDark '#0f1115'
          npx cap sync android

      - name: Use the fixed SRK Bot signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../${{ matrix.apk }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}
          path: ${{ matrix.apk }}

  release:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SRK Bot v1.0.${{ github.run_number }}
          body: |
            Two apps — install either or both (they sit side by side):
            - **SRK-Bot.apk** — online bots (Gemini / OpenAI) + offline backup
            - **SRK-Bot-Offline.apk** — fully offline, on-device AI, no API key needed

            Open the APK on your Android phone to install or update.
            (Allow "Install unknown apps" for your browser/Files app if asked.)
          files: apks/*.apk
          make_latest: true
